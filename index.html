<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Agora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>Clima Agora</h1>

        <form id="weather-form">
            <input type="text" id="city-input" placeholder="Digite a cidade (ex: São Paulo)" required>
            <button type="submit">Buscar</button>
        </form>

        <button id="geo-btn" type="button">Usar minha localização</button>

        <div id="result" class="result hidden">
            <h2 id="city-name"></h2>
            <p id="description"></p>
            <p class="temp"><span id="temp"></span>°C</p>
            <p>Sensação térmica: <span id="feels-like"></span>°C</p>
            <p>Umidade: <span id="humidity"></span>%</p>
            <p>Vento: <span id="wind"></span> m/s</p>
        </div>

        <p id="error-msg" class="error hidden"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
